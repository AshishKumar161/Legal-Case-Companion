# ==============================================================================
# Legal Case Companion — Cloud Infrastructure Blueprint (Render.com)
#
# REGION ARCHITECTURE JUSTIFICATION (Singapore vs. Mumbai):
# - Render Web & Worker Services: Configured in `region: singapore` (sin).
#   Render.com does not offer a native India (Mumbai / ap-south-1) region.
#   Singapore serves as Render's primary Asia-Pacific hub with direct submarine
#   cable interconnects to Mumbai and Chennai, delivering the lowest round-trip
#   latency (~32-45ms) available for Indian domestic users.
# - AWS Storage & Encryption: Configured strictly in `AWS_REGION: ap-south-1` (Mumbai).
#   All citizen and client PII, confidential case documents, and WebRTC consultation
#   recordings are stored and encrypted under AWS KMS in Mumbai (ap-south-1) in strict
#   compliance with the Digital Personal Data Protection Act (DPDP Act 2023) and
#   the Bharatiya Sakshya Adhiniyam (BSA 2023). Compute ephemeral processes access
#   storage via TLS 1.3 encrypted endpoints.
# ==============================================================================

services:
  - type: web
    name: lcc-backend
    env: docker
    branch: main
    region: singapore
    plan: starter
    healthCheckPath: /api/v1/health/live
    preDeployCommand: "alembic upgrade head"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lcc-db
          property: connectionString
      - key: DB_SSL_MODE
        value: "require"
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: CSRF_SECRET_KEY
        generateValue: true
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        value: "sendgrid"
      - key: SENDGRID_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_S3_BUCKET_NAME
        value: lcc-secure-documents
      - key: BACKEND_CORS_ORIGINS
        value: '["https://app.legalcasecompanion.in"]'
      - key: FRONTEND_URL
        value: "https://app.legalcasecompanion.in"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AWS_WEBHOOK_SECRET
        sync: false
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: "3310"
      - key: TURN_SERVER_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: GOOGLE_OAUTH_ENABLED
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: "https://app.legalcasecompanion.in/auth/callback"
      - key: LOCAL_RECORDING_STORAGE_DIR
        value: "/app/storage/recordings"
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

  - type: worker
    name: lcc-worker
    env: docker
    branch: main
    region: singapore
    plan: starter
    dockerCommand: "python -m app.worker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lcc-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_S3_BUCKET_NAME
        value: lcc-secure-documents
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: "3310"
      - key: OPENAI_API_KEY
        sync: false

  - type: worker
    name: lcc-scheduler
    env: docker
    branch: main
    region: singapore
    plan: starter
    dockerCommand: "python -m app.scheduler"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lcc-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: lcc-frontend
    env: docker
    branch: main
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: singapore
    plan: starter
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: "https://api.legalcasecompanion.in"

  - type: psql
    name: lcc-db
    region: singapore
    plan: starter
    databaseName: legal_db
    user: lcc_admin
