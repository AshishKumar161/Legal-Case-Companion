# ==============================================================================
# Legal Case Companion (LCC) — Production Fluent Bit Log Shipper
# Collects structured container JSON logs, extracts correlation IDs,
# and ships to CloudWatch / OpenSearch / Loki with strict PII scrubbing.
# ==============================================================================

[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Tag               docker.*
    Refresh_Interval  5
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On

[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        json_app
    Reserve_Data  On

[FILTER]
    Name          modify
    Match         docker.*
    Add           service_name lcc-platform
    Add           compliance_framework DPDP_BSA

# Centralized Log Destination: AWS CloudWatch Logs or OpenSearch
[OUTPUT]
    Name                cloudwatch_logs
    Match               *
    region              ap-south-1
    log_group_name      /aws/containerinsights/lcc-prod/application
    log_stream_prefix   backend-
    auto_create_group   true
