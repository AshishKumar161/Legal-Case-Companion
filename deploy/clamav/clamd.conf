# ==============================================================================
# Legal Case Companion (LCC) — Production ClamAV Daemon Configuration
# /etc/clamav/clamd.conf
# ==============================================================================

# TCP Network Socket Configuration
TCPSocket 3310
TCPAddr 0.0.0.0
MaxConnectionQueueLength 30

# Operational Limits
MaxThreads 8
MaxQueue 100
IdleTimeout 30

# Malware Analysis Thresholds
MaxScanSize 100M
MaxFileSize 25M
MaxRecursion 10
MaxFiles 1000

# Archive & File Inspection Options
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanArchive yes

# Heuristics & Phishing Engine
HeuristicAlerts yes
HeuristicScanPrecedence yes
StructuredDataDetection yes
PhishingSignatures yes
PhishingScanURLs yes

# Database Directory
DatabaseDirectory /var/lib/clamav

# Logging
LogTime yes
LogVerbose no
LogClean no
LogSyslog yes
LogFacility LOG_LOCAL6
PidFile /run/clamav/clamd.pid
