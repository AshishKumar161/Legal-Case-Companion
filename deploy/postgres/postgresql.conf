# ==============================================================================
# Legal Case Companion (LCC) — Production PostgreSQL 16 Configuration
# Optimized for: 4 vCPU, 8GB-16GB RAM, SSD/NVMe Storage, pgvector 0.8+
# ==============================================================================

# --- Connectivity & Network ---
listen_addresses = '*'
port = 5432
max_connections = 100
superuser_reserved_connections = 3

# --- Memory Allocation ---
# Target: ~25% of total system RAM for shared_buffers
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB            # Required for fast HNSW index builds
work_mem = 16MB                         # Per-operation sort & hash memory
temp_file_limit = 10GB

# --- Shared Preload Libraries ---
shared_preload_libraries = 'vector'

# --- pgvector Engine Settings ---
# Default search depth for HNSW vector indexes (higher = better recall, slightly higher latency)
# Can be overridden dynamically per session: SET hnsw.ef_search = 100;
# hnsw.ef_search = 100

# --- Write-Ahead Log (WAL) & Checkpoints ---
wal_level = replica
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 8GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
archive_mode = on
archive_command = '/usr/local/bin/wal-archive.sh %p %f'

# --- Query Planner & SSD Storage Tuning ---
random_page_cost = 1.1                  # Fast SSD / NVMe seek time
seq_page_cost = 1.0
effective_io_concurrency = 200          # High-concurrency NVMe queues
default_statistics_target = 100

# --- Asynchronous Replication & High Availability ---
max_wal_senders = 10
max_replication_slots = 5
hot_standby = on

# --- Logging & Security Auditing ---
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250        # Log slow queries exceeding 250ms
log_line_prefix = '%m [%p] %q%u@%d [req_id: -]: '
log_timezone = 'UTC'
log_statement = 'ddl'                   # Audit all schema changes
log_connections = on
log_disconnections = on
log_lock_waits = on
deadlock_timeout = 1s

# --- Autovacuum Tuning ---
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 500

# --- Locale & Formatting ---
datestyle = 'iso, ymd'
timezone = 'UTC'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'
