services:
  - type: web
    name: lcc-backend
    env: docker
    region: singapore
    plan: starter
    healthCheckPath: /api/v1/health/live
    preDeployCommand: "alembic upgrade head"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lcc-db
          property: connectionString
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: CSRF_SECRET_KEY
        generateValue: true
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        value: "sendgrid"
      - key: SENDGRID_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_S3_BUCKET_NAME
        value: lcc-secure-documents
      - key: BACKEND_CORS_ORIGINS
        value: '["https://app.legalcasecompanion.in"]'
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AWS_WEBHOOK_SECRET
        sync: false

  - type: worker
    name: lcc-worker
    env: docker
    region: singapore
    plan: starter
    dockerCommand: "python -m app.services.job_worker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lcc-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_S3_BUCKET_NAME
        value: lcc-secure-documents

  - type: psql
    name: lcc-db
    region: singapore
    plan: starter
    databaseName: legal_db
    user: lcc_admin
