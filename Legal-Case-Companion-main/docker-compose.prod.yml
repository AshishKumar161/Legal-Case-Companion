version: "3.8"

networks:
  lcc_internal:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: lcc_postgres_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lcc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisStrongPostgresPass123!}
      POSTGRES_DB: ${POSTGRES_DB:-legal_db}
    expose:
      - "5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - lcc_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-lcc_admin} -d $${POSTGRES_DB:-legal_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lcc_redis_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "6379"
    volumes:
      - redis_prod_data:/data
    networks:
      - lcc_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  clamav:
    image: clamav/clamav:1.4.1
    container_name: lcc_clamav_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "3310"
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - lcc_internal
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3310 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s

  coturn:
    image: coturn/coturn:4.6.2-alpine
    container_name: lcc_coturn_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    networks:
      - lcc_internal
    command: ["-c", "/etc/coturn/turnserver.conf"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lcc_backend_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    env_file:
      - .env.example
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-lcc_admin}:${POSTGRES_PASSWORD:-ChangeThisStrongPostgresPass123!}@postgres:5432/${POSTGRES_DB:-legal_db}
      - REDIS_URL=redis://redis:6379/0
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
    volumes:
      - app_storage:/app/storage
    networks:
      - lcc_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lcc_worker_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - .env.example
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-lcc_admin}:${POSTGRES_PASSWORD:-ChangeThisStrongPostgresPass123!}@postgres:5432/${POSTGRES_DB:-legal_db}
      - REDIS_URL=redis://redis:6379/0
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
    volumes:
      - app_storage:/app/storage
    networks:
      - lcc_internal

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lcc_scheduler_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["python", "-m", "app.scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - .env.example
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-lcc_admin}:${POSTGRES_PASSWORD:-ChangeThisStrongPostgresPass123!}@postgres:5432/${POSTGRES_DB:-legal_db}
      - REDIS_URL=redis://redis:6379/0
    networks:
      - lcc_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lcc_frontend_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:8000
    networks:
      - lcc_internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  postgres_prod_data:
  redis_prod_data:
  clamav_db:
  app_storage:

