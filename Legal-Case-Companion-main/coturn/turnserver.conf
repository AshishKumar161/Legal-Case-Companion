# ==============================================================================
# Legal Case Companion (LCC) — Production CoTURN Configuration
# ==============================================================================

# STUN / TURN listening ports
listening-port=3478
tls-listening-port=5349

# TURN Realm and Authentication Mechanism
realm=turn.legalcasecompanion.in
fingerprint
lt-cred-mech

# Static authentication secret for HMAC dynamic ephemeral token generation
# (Must match TURN_CREDENTIAL / secret configured in app/core/config.py)
use-auth-secret
static-auth-secret=CHANGEME_COTURN_STATIC_AUTH_SECRET

# Stale nonce lifetime in seconds (10 minutes)
stale-nonce=600

# Quotas and bandwidth controls
total-quota=200
user-quota=20
bps-capacity=0

# Security and network hardening
no-multicast-peers
no-cli
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Logging
verbose
log-file=stdout
