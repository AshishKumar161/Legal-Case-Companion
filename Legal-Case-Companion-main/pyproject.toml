[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-case-companion-backend"
version = "0.1.0"
description = "India-focused Legal Case Companion Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "sqlalchemy>=2.0.31",
    "alembic>=1.13.2",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.3.4",
    "argon2-cffi>=23.1.0",
    "PyJWT[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "email-validator>=2.1.0",
    "slowapi>=0.1.9",
    "boto3>=1.34.0",
    "uuid-utils>=0.9.0",
    "openai>=1.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "black>=24.4.2",
    "isort>=5.13.2",
    "mypy>=1.10.1",
    "ruff>=0.5.1",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
known_first_party = ["app"]

[tool.ruff.lint]
extend-select = ["B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "app.api.deps.RequireRole"]

[tool.mypy]
strict = false
ignore_missing_imports = true
explicit_package_bases = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
